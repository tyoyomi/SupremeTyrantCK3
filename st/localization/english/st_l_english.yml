l_english:
 # Trait
 trait_st_supreme_tyrant:0 "Supreme Tyrant"
 trait_st_supreme_tyrant_desc:0 "The realm obeys because it is terrified. Absolute Tyranny soft-lands cruelty; Arrest, Spectacle, Crush, Confiscate, and Oath of Fear plant a terrified yes. Soft peer to Supreme Diplomat (charm), Supreme Schemes (hooks), and Supreme Sovereign (demigod / CBs). Personal sheet stays below a Supreme Sovereign."

 # Intensity / Absolute Tyranny modifiers
 st_tyranny_low_modifier:0 "Absolute Tyranny (Low)"
 st_tyranny_low_modifier_desc:0 "Mild dread floor and soft vassal-opinion land while intensity is Low."
 st_tyranny_med_modifier:0 "Absolute Tyranny (Mid)"
 st_tyranny_med_modifier_desc:0 "Strong dread mute and soft-land while intensity is Mid."
 st_tyranny_high_modifier:0 "Absolute Tyranny (High)"
 st_tyranny_high_modifier_desc:0 "Near-immunity cruelty soft-land with a solid dread floor while intensity is High. Mass Terror unlocked."
 st_cowed_modifier:0 "Cowed by Tyrant"
 st_cowed_modifier_desc:0 "Terrified toward a Supreme Tyrant. Fear theater — not charm, not hooks."
 st_crushed_modifier:0 "Crushed Dissent"
 st_crushed_modifier_desc:0 "Recently broken by a Supreme Tyrant's Crush Dissent."
 st_oath_of_fear_modifier:0 "Oath of Fear"
 st_oath_of_fear_modifier_desc:0 "A lasting terrified-subject lean toward a Supreme Tyrant. Soft hesitation against joining factions while dread holds."

 # Opinions
 st_cowed_fear_opinion:0 "Cowed Fear"
 st_crushed_dissent_opinion:0 "Crushed Dissent"
 st_oath_of_fear_opinion:0 "Oath of Fear"
 st_spectacle_terror_opinion:0 "Execution Spectacle"
 st_confiscated_under_dread_opinion:0 "Confiscated Under Dread"
 st_arbitrary_arrest_opinion:0 "Arbitrary Arrest"

 # Decisions
 st_embrace_supreme_tyrant_decision:0 "Embrace Supreme Tyrant"
 st_embrace_supreme_tyrant_decision_desc:0 "Accept the mantle of Supreme Tyrant. Absolute Tyranny soft-lands cruelty; Arrest, Spectacle, Crush, Confiscate, and Oath of Fear plant a terrified yes. Soft peer to Diplomat (charm) and Schemes (hooks)."
 st_embrace_supreme_tyrant_decision_tooltip:0 "Gain the Supreme Tyrant trait and High-intensity Absolute Tyranny package"
 st_embrace_supreme_tyrant_decision_confirm:0 "Embrace Tyrant"
 st_embrace_supreme_tyrant_decision_effect_tt:0 "You become a Supreme Tyrant"

 st_renounce_supreme_tyrant_decision:0 "Renounce Supreme Tyrant"
 st_renounce_supreme_tyrant_decision_desc:0 "Lay down the Supreme Tyrant mantle. Absolute Tyranny modifiers and fear verbs go with it."
 st_renounce_supreme_tyrant_decision_tooltip:0 "Remove the Supreme Tyrant trait and modifiers"
 st_renounce_supreme_tyrant_decision_confirm:0 "Renounce"
 st_renounce_supreme_tyrant_decision_effect_tt:0 "You lose Supreme Tyrant"

 st_manage_silence_the_realm_decision:0 "Silence the Realm"
 st_manage_silence_the_realm_decision_desc:0 "Review intensity, Absolute Tyranny modules, cowed list, dread readout, Mass Terror, and Crush active dissent. Two pages — Done stays on top. Cycle options show the current value before flipping. Fear twin of Supreme Diplomat."
 st_manage_silence_the_realm_decision_tooltip:0 "Open the Silence the Realm manage hub"
 st_manage_silence_the_realm_decision_confirm:0 "Open Hub"
 st_manage_silence_the_realm_decision_effect_tt:0 "Opens the Silence the Realm hub"

 # Interactions
 st_grant_supreme_tyrant_interaction:0 "Grant Supreme Tyrant"
 st_grant_supreme_tyrant_interaction_desc:0 "Bestow the Supreme Tyrant mantle on a child or grandchild. Available when the granting rule allows targets."

 st_revoke_supreme_tyrant_interaction:0 "Revoke Supreme Tyrant"
 st_revoke_supreme_tyrant_interaction_desc:0 "Strip [recipient.GetShortUIName] of the Supreme Tyrant honor."

 st_arbitrary_arrest_interaction:0 "Arbitrary Arrest"
 st_arbitrary_arrest_interaction_desc:0 "Imprison [recipient.GetShortUIName] on dread authority alone — no crime or hook wall. Feeds Public Execution Spectacle. Soft peer: does not fabricate secrets or grant hooks (Supreme Schemes)."
 st_arbitrary_arrest_interaction_extra_icon:0 "$st_arbitrary_arrest_interaction$"

 st_public_execution_interaction:0 "Public Execution Spectacle"
 st_public_execution_interaction_desc:0 "Execute a prisoner as theater. Dread splash to court and vassals by intensity; tyranny soft-lands under Absolute Tyranny. Soft peer: not a Supreme Schemes murder scheme."
 st_public_execution_interaction_extra_icon:0 "$st_public_execution_interaction$"

 st_crush_dissent_interaction:0 "Crush Dissent"
 st_crush_dissent_interaction_desc:0 "Break or cow a vassal faction against you. Members leave the faction, take a short Crushed modifier, and dread splash. Your vassal factions only — not foreign factions. Soft dissolve if hard dissolve is unavailable."
 st_crush_dissent_interaction_extra_icon:0 "$st_crush_dissent_interaction$"

 st_confiscate_under_dread_interaction:0 "Confiscate Under Dread"
 st_confiscate_under_dread_interaction_desc:0 "Revoke a county from [recipient.GetShortUIName] because they fear you. Tyranny soft-lands under Absolute Tyranny; target is cowed after. Soft peer: not Keep Titles, not conquest, not Steal Title scheme."
 st_confiscate_under_dread_interaction_extra_icon:0 "$st_confiscate_under_dread_interaction$"

 st_force_oath_of_fear_interaction:0 "Force Oath of Fear"
 st_force_oath_of_fear_interaction_desc:0 "Force a lasting terrified-subject lean on a landed direct vassal — levy/tax obedience theater and soft hesitation against faction join while your dread holds. High auto-forces. Fear only — never hooks. Soft peer: not Exalted Vassal buffs, not Diplomat charm."
 st_force_oath_of_fear_interaction_extra_icon:0 "$st_force_oath_of_fear_interaction$"

