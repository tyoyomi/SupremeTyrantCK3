 # Events
 st_events.1001.t:0 "Supreme Tyrant"
 st_events.1001.desc:0 "The room goes quiet when you enter. Absolute Tyranny soft-lands the cruelty wall. They will obey because they are terrified."
 st_events.1001.a:0 "Let them tremble"

 st_events.1002.t:0 "Mantle Laid Down"
 st_events.1002.desc:0 "You renounce Supreme Tyrant. Absolute Tyranny fades. The realm will remember — for a while."
 st_events.1002.a:0 "Enough"

 st_events.2001.t:0 "Arbitrary Arrest"
 st_events.2001.desc:0 "No crime. No hook. Only dread authority. They are taken to the dungeon."
 st_events.2001.a:0 "Lock them away"

 st_events.2101.t:0 "Public Execution Spectacle"
 st_events.2101.desc:0 "The execution is theater. Dread ripples through court and vassals. Absolute Tyranny soft-lands the sting."
 st_events.2101.a:0 "Let them watch"

 st_events.2201.t:0 "Crush Dissent"
 st_events.2201.desc:0 "The faction breaks. Members leave. Crushed modifiers stick. Soft dissolve — leave and fear, not a hard engine dissolve if unavailable."
 st_events.2201.a:0 "Silence them"

 st_events.2301.t:0 "Confiscate Under Dread"
 st_events.2301.desc:0 "You take the county because they fear you. Not Keep Titles. Not conquest. They are cowed after."
 st_events.2301.a:0 "It is mine"

 st_events.2401.t:0 "Mass Terror"
 st_events.2401.desc:0 "The room goes quiet. Every direct vassal is briefly cowed. Long cooldown. High intensity only."
 st_events.2401.a:0 "Kneel"

 st_events.2402.t:0 "Mass Terror — Factions"
 st_events.2402.desc:0 "Faction members against you are cowed in a bound sweep. Long cooldown."
 st_events.2402.a:0 "Break them"

 st_events.2403.t:0 "Spread Terror"
 st_events.2403.desc:0 "A milder dread drip. One vassal is singled out and cowed. Distinct from Mass Terror."
 st_events.2403.a:0 "A reminder"

 st_events.2501.t:0 "Oath of Fear"
 st_events.2501.desc:0 "They swear a terrified-subject lean. Soft hesitation against faction join while your dread holds. Fear only — never hooks."
 st_events.2501.a:0 "Swear it"

 st_terror.1001.t:0 "Reign of Terror"
 st_terror.1001.desc:0 "Another year of dread. Prestige theater. One direct vassal is cowed at random. The pulse keeps fear alive between clicks."
 st_terror.1001.a:0 "Continue the reign"
